# Application configuration. Secrets (the database password) never live here:
# they come from the DB_PASSWORD environment variable.
# Copy this file to config.yaml, adjust, mount or bake it at deploy time.

log_level: info          # debug | info | warn | error

http:
  port: 8080
  startup_timeout: 15s
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s
  allowed_origins:
    - http://localhost:5173
    - http://localhost:3000

db:
  host: localhost
  port: 5432
  user: mandat
  database: mandat
  sslmode: disable     # DB_PASSWORD comes from the environment

