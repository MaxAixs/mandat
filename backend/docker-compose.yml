# Local development environment. The database password comes from .env
# (copy .env.example to .env first).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mandat
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set, copy .env.example to .env}"
      POSTGRES_DB: mandat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandat"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set, copy .env.example to .env}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Admin sessions only: no volume, a restart just logs everyone out.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
