# Local development environment. The database password comes from .env
# (copy .env.example to .env first).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mandat
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set, copy .env.example to .env}"
      POSTGRES_DB: mandat
    restart: unless-stopped
    # Loopback only: the database must not be reachable from other hosts.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandat"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is not set, copy .env.example to .env}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_PUBLIC_BASE_URL: "${R2_PUBLIC_BASE_URL:-}"
      HTTP_SECURE_COOKIES: "${HTTP_SECURE_COOKIES:-}"
      HTTP_ALLOWED_ORIGINS: "${HTTP_ALLOWED_ORIGINS:-}"
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Admin sessions and rate-limit counters: no volume, a restart logs everyone out.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback only: this Redis has no password.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
