# Local development environment. Credentials here are dev-only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mandat
      POSTGRES_PASSWORD: mandat
      POSTGRES_DB: mandat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
