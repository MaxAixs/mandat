  # The single application configuration. Docker Compose is the supported way to
# run the service, so the hosts below are Compose service names. Secrets never
# live here: they come from the environment (see .env.example).

log_level: info          # debug | info | warn | error

http:
  port: 8080
  startup_timeout: 15s
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 30s     # must exceed download.timeout (pasted cover fetch + upload)
  idle_timeout: 60s
  shutdown_timeout: 10s
  session_ttl: 12h
  secure_cookies: false # true behind production HTTPS (env HTTP_SECURE_COOKIES);
                        # required once allowed_origins lists a non-local origin
  allowed_origins:      # env HTTP_ALLOWED_ORIGINS (comma-separated) overrides
    - http://localhost:5173
    - http://localhost:3000
    - http://localhost:3001
  # CF-Connecting-IP is trusted only on requests coming from these addresses:
  # Cloudflare's published ranges (https://www.cloudflare.com/ips/, 2026-11-16).
  # Add any reverse proxy that sits between Cloudflare and the API.
  trusted_proxies:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32
  client_ip_headers:
    - CF-Connecting-IP

db:
  host: db
  port: 5432
  user: mandat
  database: mandat
  sslmode: disable     # DB_PASSWORD comes from the environment

redis:                # admin sessions; the local Compose Redis has no password
  addr: redis:6379
  db: 0
  dial_timeout: 5s

rates:                # upstream rate providers (keep in sync with config.go defaults)
  nbu_url: "https://bank.gov.ua/NBU_Exchange/exchange" # endpoint without query parameters
  fuel_url: "https://20.com.ua/api/v1/prices"
  refresh_interval: 24h # how often both tables are re-fetched (min 1m)
  http_timeout: 10s     # one request to a provider

telegram:             # public channel whose subscriber count is shown on /advertising
  channel_url: "https://t.me/mandat_ua" # https://t.me/<name> page, parsed for «N subscribers»
  refresh_interval: 1h  # how often the count is re-fetched (min 1m)

storage:              # Cloudflare R2; keys come from R2_ACCESS_KEY_ID /
  endpoint: ""        # R2_SECRET_ACCESS_KEY (or set R2_ACCOUNT_ID to derive it)
  bucket: ""         # or R2_ENDPOINT / R2_BUCKET env overrides
  public_base_url: "" # REQUIRED when storage is enabled: public r2.dev or
                      # custom-domain root; the S3 API endpoint is authenticated
                      # and its fallback URLs are not publicly deliverable

download:             # pasted-image fetcher (covers); AllowPrivate is code-only
  timeout: 15s        # must stay below http.write_timeout
  max_bytes: 10485760 # 10 MB, keep in sync with the R2 driver cap
  max_redirects: 3

rate_limit:           # global per-client limit, counters in Redis (fails open)
  enabled: true
  requests: 300       # per client (IPv4 address or IPv6 /64) per window
  window: 1m

login_rate_limit:     # login attempts, counted per client IP and per account (Redis)
  enabled: true
  requests: 5
  window: 5m
