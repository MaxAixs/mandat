# Configuration used by Docker Compose. The database password comes from
# the DB_PASSWORD environment variable (see .env.example) and is never
# written to this file. Compose mounts this file over the image default.

log_level: info

http:
  port: 8080
  startup_timeout: 15s
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s
  allowed_origins:
    - http://localhost:5173
    - http://localhost:3000

db:
  host: db
  port: 5432
  user: mandat
  database: mandat
  sslmode: disable
